# Default values for linkace.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container images more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
linkace:
  repository: linkace/linkace
  tag: "2.x-php-8.4-test"
  pullPolicy: Always
  backupVolumeSize: 1Gi
  backupStorageClassName: default
  logsVolumeSize: 500Mi
  logsStorageClassName: default
  probeHost: ""  # Set to the app hostname when TrustHosts middleware restricts host headers (e.g. links.example.com)

# This config should contain the same contents as the provided .env.k8s file
config:
  # existingSecret: ""   # Use this when !null/empty. It must be the name of an existing secret that's been created outside of this helm chart.
  data: {}  # Fill this out when existingSecret is null/empty. Beware of secrets.
  # APP_KEY: someRandomStringWith32Characters
  # DB_CONNECTION: mysql
  # DB_HOST: linkace-mariadb
  # DB_PORT: 3306
  # DB_DATABASE: linkace
  # DB_USERNAME: linkace
  # DB_PASSWORD: ChangeThisToASecurePassword!
  # 
  # REDIS_HOST: linkace-redis
  # REDIS_PASSWORD: ChangeThisToASecurePassword!
  # REDIS_PORT: 6379
  # 
  # MAIL_FROM_ADDRESS: your@email.com
  # MAIL_FROM_NAME: LinkAce
  # MAIL_DRIVER: smtp
  # MAIL_HOST: smtp.mailtrap.io
  # MAIL_PORT: 2525
  # MAIL_USERNAME: null
  # MAIL_PASSWORD: null
  # MAIL_ENCRYPTION: null
  # 
  # BACKUP_ENABLED: true
  # SESSION_DRIVER: redis
  # CACHE_DRIVER: redis

database:
  # if you have an existing database, set enabled: false
  enabled: true
  port: 3306
  repository: docker.io/library/mariadb
  tag: "11.5"
  pullPolicy: IfNotPresent
  volumeSize: 1Gi
  storageClassName: default

redis:
  # if you have an existing database, set enabled: false
  enabled: true
  port: 6379
  repository: docker.io/library/redis
  tag: "7.2"
  pullPolicy: IfNotPresent
  volumeSize: 1Gi
  storageClassName: default

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "nginx"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: linkace-microk8s.test
  paths:
    - path: /
      pathType: Prefix
      backend:
        service:
          name: http
          port:
            number: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Laravel schedule:work daemon — runs continuously and fires due jobs internally.
# Eliminates per-minute pod lifecycle writes to the k8s API that CronJob generates.
# When enabled, set cronjob.enabled: false to avoid duplicate job execution.
scheduler:
  enabled: false
  resources: {}

# CronJob running schedule:run every minute. Enabled by default for backward compatibility.
# Set enabled: false when scheduler.enabled: true.
cronjob:
  enabled: true
